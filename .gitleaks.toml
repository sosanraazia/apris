# Extends the default gitleaks rules. Only well-understood placeholders are allowed here.
[extend]
useDefault = true

[allowlist]
description = "placeholders that are not secrets"
paths = [
  '''\.env\.example$''',
  '''deploy/apris\.env\.example$''',
  '''package-lock\.json$''',
]
regexes = [
  '''ci-only-not-a-real-secret-[0-9]+''',
  '''change-me-to-a-long-random-string-of-32-plus-chars''',
]
