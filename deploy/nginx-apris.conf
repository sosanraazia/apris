# /etc/nginx/sites-available/apris — replace DOMAIN and the certificate paths (install.sh does DOMAIN for you).
# Login brute-force brake (per client IP). The app also locks usernames after repeated failures.
limit_req_zone $binary_remote_addr zone=apris_login:10m rate=6r/m;

server_tokens off;

server {
    listen 80;
    server_name DOMAIN;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name DOMAIN;

    # Either a certbot certificate (default paths below) or the certificate your university IT provides.
    ssl_certificate     /etc/letsencrypt/live/DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMAIN/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 15m;   # PDF uploads

    # Security headers (HSTS, CSP, framing, nosniff, referrer) are set by the app itself.

    # Only POSTs (the login form submission) are rate limited; page views are not.
    location = /login {
        limit_req zone=apris_login burst=8 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;   # never pass through a client-supplied value
        proxy_read_timeout 120s;
    }
}
